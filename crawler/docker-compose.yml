services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: project_emerald
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - emerald_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_emerald"]
      interval: 5s
      timeout: 5s
      retries: 10

  crawler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/project_emerald
    command: python main.py hello

volumes:
  emerald_pgdata:
